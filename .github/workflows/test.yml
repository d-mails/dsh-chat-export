name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          for f in src/*.js; do node --check "$f"; done
      - name: Unit tests
        run: node --test test/core.test.js test/client.test.js test/handlers.test.js
