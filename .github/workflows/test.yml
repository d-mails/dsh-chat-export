name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax and locale checks
        run: |
          node --check index.js
          node --check client.js
          for f in src/*.js test/*.js; do node --check "$f"; done
          node -e "for (const f of ['locale/en.json','locale/zh.json']) JSON.parse(require('node:fs').readFileSync(f, 'utf8'))"
      - name: Unit tests and coverage gate
        run: npm run coverage
      - name: Package contents
        run: npm pack --dry-run
